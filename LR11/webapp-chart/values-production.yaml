replicaCount: 3

image:
  repository: nginx
  tag: "1.23"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 80

labels:
  environment: production
  app: webapp

config:
  logLevel: "info"
  debugMode: "false"
  apiEndpoint: "https://api.example.com"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi