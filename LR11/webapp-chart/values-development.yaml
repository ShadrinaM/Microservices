replicaCount: 1

image:
  repository: nginx
  tag: "1.23"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 80

labels:
  environment: development
  app: webapp

config:
  logLevel: "debug"
  debugMode: "true"
  apiEndpoint: "https://dev-api.example.com"

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi