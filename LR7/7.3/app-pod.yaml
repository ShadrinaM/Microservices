apiVersion: v1
kind: Pod
metadata:
  name: app-pod
spec:
  containers:
  - name: app-container
    image: busybox:1.28
    command: ["/bin/sh"]
    args: ["-c", "sleep 3600"]
    env:
      - name: LOG_LEVEL
        valueFrom:
          configMapKeyRef:
            name: app-config
            key: log.level
    volumeMounts:
      - name: config-volume
        mountPath: /app/config
  volumes:
  - name: config-volume
    configMap:
      name: app-config
      items:
        - key: database.url
          path: db.properties