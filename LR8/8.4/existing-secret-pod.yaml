apiVersion: v1
kind: Pod
metadata:
  name: problem-pod-existing
spec:
  containers:
  - name: test-container
    image: nginx:alpine
    env:
    - name: SECRET_USERNAME
      valueFrom:
        secretKeyRef:
          name: existing-secret
          key: username
    volumeMounts:
    - name: secret-volume
      mountPath: /etc/secrets
  volumes:
  - name: secret-volume
    secret:
      secretName: existing-secret