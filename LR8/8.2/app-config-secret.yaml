apiVersion: v1
kind: Secret
metadata:
  name: app-config-secret
stringData:
  application.properties: |
    # Конфигурация базы данных
    db.host=postgresql-svc
    db.port=5432
    db.name=myapp
    # Настройки сервера
    server.port=8080
    logging.level=INFO
  security.key: |
    -----BEGIN SECURITY KEY-----
    Это сверхсекретный ключ шифрования.
    Он должен быть защищен максимально.
    Используются права доступа 0400.
    -----END SECURITY KEY-----