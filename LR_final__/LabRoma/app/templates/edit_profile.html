{% extends "base.html" %}

{% block title %}Редактирование профиля - User Platform{% endblock %}

{% block content %}
<h1>Редактирование профиля</h1>
<form method="POST">
    <div class="form-group">
        <label for="username">Логин (нельзя изменить):</label>
        <input type="text" id="username" value="{{ user.username }}" disabled>
    </div>
    
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ user.email if user.email else '' }}">
    </div>
    
    <div class="form-group">
        <label for="full_name">Полное имя:</label>
        <input type="text" id="full_name" name="full_name" value="{{ user.full_name if user.full_name else '' }}">
    </div>
    
    <div class="form-group">
        <label for="password">Новый пароль (оставьте пустым, чтобы не менять):</label>
        <input type="password" id="password" name="password">
        <small>Минимум 6 символов</small>
    </div>
    
    <div class="form-group">
        <label for="status">Статус:</label>
        <input type="text" id="status" value="{{ user.status }}" disabled>
    </div>
    
    <button type="submit" class="btn">Сохранить изменения</button>
    <a href="{{ url_for('profile') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
