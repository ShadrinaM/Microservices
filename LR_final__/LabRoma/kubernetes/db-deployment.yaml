apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  namespace: user-platform-exam
  labels:
    app: user-platform
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-platform
      component: database
  template:
    metadata:
      labels:
        app: user-platform
        component: database
    spec:
      containers:
      - name: postgres
        image: postgres:13-alpine
        env:
        - name: POSTGRES_DB
          value: "userdb"
        - name: POSTGRES_USER
          value: "user"
        - name: POSTGRES_PASSWORD
          value: "password"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-storage
        emptyDir: {}