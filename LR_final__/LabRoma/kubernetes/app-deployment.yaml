apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: user-platform-exam
  labels:
    app: user-platform
    component: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-platform
      component: webapp
  template:
    metadata:
      labels:
        app: user-platform
        component: webapp
    spec:
      containers:
      - name: webapp
        image: platform:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: SECRET_KEY
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SECRET_KEY
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DATABASE_URL
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5