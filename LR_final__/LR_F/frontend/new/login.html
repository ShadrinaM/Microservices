<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .message {
            padding: 10px;
            border-radius: 5px;
            margin: 15px 0;
            display: none;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            display: block;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #4CAF50;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .back-btn {
            background: #757575;
            margin-top: 10px;
        }
        .back-btn:hover {
            background: #616161;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 id="loginTitle">Вход в систему</h2>
        
        <div id="message" class="message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" id="submitBtn">Войти</button>
            <button type="button" class="back-btn" onclick="window.location.href='index.html'">Назад</button>
        </form>
        
        <div class="links">
            <p>Нет аккаунта? <a href="register.html">Зарегистрируйтесь</a></p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080'; // Измените на ваш адрес
        
        // Получаем конфигурацию из API
        async function loadConfig() {
            try {
                const response = await fetch(`${API_URL}/api/config`);
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('loginTitle').textContent = data.data.login_title || 'Вход в систему';
                }
            } catch (error) {
                console.error('Ошибка загрузки конфигурации:', error);
            }
        }
        
        // Обработка формы входа
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            
            // Показываем загрузку
            submitBtn.disabled = true;
            submitBtn.textContent = 'Вход...';
            messageDiv.style.display = 'none';
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Сохраняем токен
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('user_id', data.user_id);
                    
                    // Показываем успех
                    messageDiv.className = 'message success';
                    messageDiv.textContent = 'Успешный вход! Перенаправление...';
                    messageDiv.style.display = 'block';
                    
                    // Перенаправляем на профиль через 2 секунды
                    setTimeout(() => {
                        window.location.href = 'profile.html';
                    }, 2000);
                } else {
                    // Показываем ошибку
                    messageDiv.className = 'message error';
                    messageDiv.textContent = data.error || 'Ошибка входа';
                    messageDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Войти';
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Ошибка сети. Проверьте подключение.';
                messageDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Войти';
            }
        });
        
        // При загрузке страницы
        document.addEventListener('DOMContentLoaded', loadConfig);
    </script>
</body>
</html>
