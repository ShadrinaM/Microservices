apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: user-platform-exam
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: frontend-files
          mountPath: /usr/share/nginx/html
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 30
      volumes:
      - name: frontend-files
        configMap:
          name: frontend-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: user-platform-exam
data:
  index.html: |
    <!DOCTYPE html>
    <!-- Вставьте содержимое index.html сюда -->
  login.html: |
    <!-- Вставьте содержимое login.html сюда -->
  register.html: |
    <!-- Вставьте содержимое register.html сюда -->
  profile.html: |
    <!-- Вставьте содержимое profile.html сюда -->
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: user-platform-exam
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: user-platform-exam
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80