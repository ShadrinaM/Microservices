apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: user-platform-exam
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5002
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: db-password
            - name: DB_HOST
              value: "postgres-service.user-platform-exam.svc.cluster.local"
            - name: DB_NAME
              value: "userdb"
            - name: DB_USER
              value: "admin"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: user-platform-exam
spec:
  selector:
    app: notification-service
  ports:
    - port: 80
      targetPort: 5002
