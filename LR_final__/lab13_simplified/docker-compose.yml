version: "3.8"
services:
  auth:
    build: ./auth-service
    ports:
      - "5000:5000"
    environment:
      APP_SECRET: "dev-secret"
      LOGIN_TITLE: "Вход в систему"
      REGISTER_TITLE: "Регистрация"
      WELCOME_MESSAGE: "Добро пожаловать в платформу"
    volumes:
      - ./auth-service/users.db:/app/users.db
    depends_on:
      - profile
      - notification

  profile:
    build: ./profile-service
    ports:
      - "5001:5001"
    environment:
      AUTH_URL: "http://auth:5000"
    volumes:
      - ./profile-service/profiles.db:/app/profiles.db
    depends_on:
      - auth

  notification:
    build: ./notification-service
    ports:
      - "5002:5002"
    depends_on:
      - auth
